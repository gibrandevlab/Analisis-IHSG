name: Debug Structure

on: workflow_dispatch

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List all files
        run: |
          echo "Current Directory:"
          pwd
          echo "List files recursively:"
          ls -R
          echo "Check for main.py specifically:"
          if [ -f main.py ]; then
            echo "✅ main.py FOUND at root!"
          else
            echo "❌ main.py NOT FOUND at root."
          fi
