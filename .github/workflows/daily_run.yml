name: Daily Python Script

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 09:00 WIB - Market opens (all days)
    - cron: '30 2 * * 1-5'  # 09:30 WIB - Early trading (all days)
    - cron: '0 3 * * 1-5'   # 10:00 WIB - Mid Session 1 (all days)
    - cron: '45 6 * * 1-5'  # 13:45 WIB - 15min after Session 2 (Mon-Thu: 13:30)
    - cron: '15 7 * * 5'    # 14:15 WIB - 15min after Session 2 (Fri: 14:00)
    - cron: '49 8 * * 1-5'  # 15:49 WIB - Market close (all days)
  workflow_dispatch: # Allows manual run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          TZ: 'Asia/Jakarta'
          TELEGRAM_TOKEN: '7827421978:AAE4NC3_ivtpqBqtJf_W2BTgSLtx_QDk5Y8'
          TELEGRAM_CHAT_ID: '5840594566'
        run: |
          python main.py
          sleep 30
          python main.py
