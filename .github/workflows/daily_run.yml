name: Daily Python Script

on:
  schedule:
    - cron: '0 15 * * *' # 10:00 PM WIB (22:00 WIB -> 15:00 UTC)
    - cron: '0 22 * * *' # 05:00 AM WIB (05:00 WIB -> 22:00 UTC previous day)
    - cron: '45 1 * * *' # 08:45 AM WIB (08:45 WIB -> 01:45 UTC)
    - cron: '30 2 * * *' # 09:30 AM WIB (09:30 WIB -> 02:30 UTC)
  workflow_dispatch: # Allows manual run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          TELEGRAM_TOKEN: '7827421978:AAE4NC3_ivtpqBqtJf_W2BTgSLtx_QDk5Y8'
          TELEGRAM_CHAT_ID: '5840594566'
        run: |
          python main.py
          sleep 30
          python main.py
